# cargo-deny configuration.
# License gate: the project's final license is undecided (owner leans MIT), so every
# dependency must be MIT-compatible. MPL-2.0 is allowed (file-level copyleft composes
# with a permissive outer license); GPL/AGPL/LGPL are not.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Mozilla's CA certificate set (webpki-roots) is data, not code, and
    # this licence asks only that the disclaimer travel with it.
    "CDLA-Permissive-2.0",
    # One clause of aws-lc-sys's compound expression offers it.
    "MIT-0",
]

[advisories]
# A yanked version in the lockfile is always ours to fix.
yanked = "deny"
# "Unmaintained" only counts against crates this workspace chose. The
# GTK3 bindings, proc-macro-error and the unic crates all arrive under
# Tauri and cannot be swapped out from here; flagging them every run
# would train everyone to ignore the gate that catches the real thing.
unmaintained = "workspace"
# zip's extraction advisories: SUID/SGID bits kept (0367), symlinks that
# point outside the destination (0368), permissions applied through them
# (0369). zip arrives only as tauri-plugin-updater's Windows unpacker for a
# zipped installer. Petrel installs through `download_and_install`, which
# checks the release signature against the key built into the app before
# anything is unpacked, so an archive that gets that far was signed by
# whoever cuts releases, who could ship any program anyway; and
# scripts/release.sh publishes updates for macOS alone, so nothing reaches
# that unpacker today. The fix is zip 9, which no updater release takes
# yet: drop these when one does.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater: signed updates only, none for Windows" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater: signed updates only, none for Windows" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater: signed updates only, none for Windows" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
